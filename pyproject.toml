[project]
name = "thesis-ledger"
version = "0.1.0"
description = "Evidence-first investment thesis ledger for Codex"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=0.10",
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.6",
    "yfinance>=0.2.40",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
thesis = "src.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
